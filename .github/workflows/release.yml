# Publishes a GitHub release (which HACS offers as an update) whenever the "version" in
# custom_components/bedtime_bridge/manifest.json changes on main. Same pattern as the
# washer-and-dryer card: bump the version, merge, and HACS shows the update.
name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/bedtime_bridge/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the integration version
        id: version
        run: |
          v=$(jq -r .version custom_components/bedtime_bridge/manifest.json)
          test -n "$v" && test "$v" != "null"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Create the release if it's new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Bedtime Bridge $TAG" --generate-notes
