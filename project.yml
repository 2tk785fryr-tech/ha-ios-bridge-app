name: BedtimeBridge
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple team ID here or in Xcode
targets:
  BedtimeBridge:
    type: application
    platform: iOS
    sources:
      - BedtimeBridge
      - Shared
    dependencies:
      - target: BedtimeBridgeWidgets
    entitlements:
      path: BedtimeBridge/BedtimeBridge.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.BedtimeBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BedtimeBridge
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: BedtimeBridge/Info.plist
      properties:
        CFBundleDisplayName: Bedtime Bridge
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSCalendarsFullAccessUsageDescription: Bedtime Bridge reads your shift and appointment events to work out when you need to wake up.
        NSAlarmKitUsageDescription: Bedtime Bridge sets your wake-up alarms for work shifts and appointments.
        NSLocationWhenInUseUsageDescription: If no home address is set, your current location is used as the starting point for drive times.
        NSSupportsLiveActivities: true
        UIAppFonts:
          - Sora-Light.ttf
          - Sora-Regular.ttf
          - Sora-Medium.ttf
          - Sora-SemiBold.ttf
          - Sora-Bold.ttf
        # Lets the app reach Home Assistant on your home network over plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Bedtime Bridge talks to Home Assistant on your home network to run your wake-up routines.
  BedtimeBridgeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - BedtimeBridgeWidgets
      - Shared
    entitlements:
      path: BedtimeBridgeWidgets/BedtimeBridgeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.BedtimeBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BedtimeBridge.Widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: BedtimeBridgeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Bedtime Bridge
        UIAppFonts:
          - Sora-Light.ttf
          - Sora-Regular.ttf
          - Sora-Medium.ttf
          - Sora-SemiBold.ttf
          - Sora-Bold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  BedtimeBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BedtimeBridgeTests
    dependencies:
      - target: BedtimeBridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BedtimeBridge:
    build:
      targets:
        BedtimeBridge: all
        BedtimeBridgeTests: [test]
    test:
      targets:
        - BedtimeBridgeTests
